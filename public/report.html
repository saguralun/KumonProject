<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KumonDB Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/report.css?v=20260828-worksheet-forecast">
  <link rel="stylesheet" href="/css/app-scale.css?v=20260828-schedule-active-toggle">
</head>
<body>
  <main class="report-page">
    <aside class="report-sidebar">
      <nav class="side-nav" aria-label="Main navigation">
        <a class="home-link active current-page" href="/report.html" data-staff-up>📊 Report</a>
        <div class="nav-flyout">
          <button type="button" class="home-link nav-flyout-trigger">งานประจำ</button>
          <div class="nav-flyout-menu">
            <a class="home-link" href="/worksheet.html">📝 WS Input</a>
          </div>
        </div>
        <div class="nav-flyout">
          <button type="button" class="home-link nav-flyout-trigger">จัดการ</button>
          <div class="nav-flyout-menu">
            <a class="home-link" href="/student-manager.html">👤 Students</a>
            <a class="home-link" href="/payment.html" data-staff-up>💰 Payment</a>
            <a class="home-link" href="/report.html" data-staff-up>📊 Report</a>
          </div>
        </div>
        <div class="nav-flyout">
          <button type="button" class="home-link nav-flyout-trigger">คลัง</button>
          <div class="nav-flyout-menu">
            <a class="home-link" href="/stock-receive.html" data-staff-up>📦 Stock</a>
            <a class="home-link" href="/stock-cut.html" data-staff-up>✂️ Stock Cut</a>
          </div>
        </div>
        <div class="nav-flyout">
          <button type="button" class="home-link nav-flyout-trigger">ระบบ</button>
          <div class="nav-flyout-menu">
            <a class="home-link" href="/" data-admin-only>🗂️ Tables</a>
            <a class="home-link" href="/opening-schedule.html" data-admin-only>🕒 Opening Schedule</a>
            <a class="home-link" href="/users.html" data-admin-only>👥 Users</a>
          </div>
        </div>
      </nav>

      <div class="side-header">
        <h1>Report</h1>
        <div class="subtle">รายงานรายเดือน / Forecast</div>
      </div>

      <section class="mode-panel">
        <button type="button" class="mode-button active" data-report-mode="monthly">Monthly</button>
        <button type="button" class="mode-button" data-report-mode="forecast">Forecast</button>
      </section>

      <section class="filter-panel">
        <label data-monthly-filter>
          <span>เดือน</span>
          <select id="reportMonth"></select>
        </label>
        <label data-monthly-filter>
          <span>ปี</span>
          <input id="reportYear" type="number" min="2000" max="2600" step="1">
        </label>
        <label data-forecast-filter class="hidden">
          <span>Forecast วัน</span>
          <input id="forecastDays" type="number" min="1" max="365" step="1" value="15">
        </label>
        <label data-forecast-filter class="hidden">
          <span>Subject</span>
          <select id="forecastSubject">
            <option value="all">All</option>
            <option value="ME">ME</option>
            <option value="EFL">EFL</option>
            <option value="TRP">TRP</option>
          </select>
        </label>
        <label data-forecast-filter class="check-row hidden">
          <input id="forecastIncludeKc" type="checkbox">
          <span>รวม KC</span>
        </label>
        <button type="button" class="primary-button" id="generateButton">📊 สร้างรายงาน</button>
        <button type="button" class="secondary-button hidden" id="forecastButton">🔮 Forecast</button>
        <button type="button" class="secondary-button hidden" id="recalculateForecastButton">🔄 คำนวณใหม่</button>
        <button type="button" class="secondary-button" id="exportButton" disabled>⬇️ Export CSV</button>
      </section>

      <div class="auth-bar" id="authBar"></div>
    </aside>

    <section class="report-workspace">
      <header class="topbar">
        <div>
          <div class="page-title">Monthly Report</div>
          <div class="subtle">รายชื่อ enrollment ที่มีกิจกรรม (WS / AT / DT / CD) ในเดือนที่เลือก</div>
        </div>
        <div class="status-line" id="statusLine" role="status">พร้อมใช้งาน</div>
      </header>

      <section class="panel report-table-panel">
        <div class="panel-header">
          <div class="panel-title">ผลลัพธ์</div>
          <div class="subtle" id="resultSubtitle">เลือกเดือน/ปี แล้วกดสร้างรายงาน</div>
        </div>
        <div class="forecast-summary hidden" id="forecastSummary"></div>
        <div class="report-table-wrap" id="reportTableWrap">
          <div class="empty-state">ยังไม่มีรายงาน</div>
        </div>
      </section>
    </section>
  </main>

  <script src="/js/authClient.js?v=20260828-cache-bust"></script>
  <script src="/js/report.js?v=20260828-worksheet-forecast"></script>
</body>
</html>
