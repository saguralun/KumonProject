<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KumonDB Table Explorer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #eef1f8;
      --surface: #ffffff;
      --surface-soft: #f6f8fc;
      --text: #141b26;
      --muted: #5f6d84;
      --line: #dde3ee;
      --rail: #0e1e33;
      --blue: #2f5fe6;
      --blue-soft: #e9f0ff;
      --red: #dc3545;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.07);
      --ease: 160ms cubic-bezier(0.4, 0, 0.2, 1);
      --font-sans: "Inter", "Sarabun", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      min-height: 0;
      overflow: hidden;
      scrollbar-width: thin;
      scrollbar-color: #b7c3d9 transparent;
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #b7c3d9;
      border-radius: 999px;
    }

    body {
      height: 100%;
      min-height: 0;
      overflow: hidden;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .table-page {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }

    .table-sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      padding: 10px;
      background: var(--rail);
      color: #e5eef7;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    .subtitle,
    .table-sidebar .subtle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .table-sidebar .subtle {
      color: #a9b8cc;
    }

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 10px;
    }

    .nav-group {
      display: grid;
      gap: 6px;
    }

    .nav-group-label {
      padding: 0 4px;
      color: #7c8ba3;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .home-link {
      display: block;
      min-height: 34px;
      border: 1px solid rgba(226, 232, 240, 0.14);
      border-radius: 7px;
      padding: 8px 10px;
      color: #dbeafe;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: background-color var(--ease), border-color var(--ease), color var(--ease);
    }

    .home-link:hover,
    .home-link.active {
      border-color: #dbeafe;
      background: #eaf2ff;
      color: var(--blue);
    }

    .auth-bar {
      margin-top: auto;
      display: grid;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .auth-user {
      display: flex;
      gap: 7px;
      align-items: center;
      min-width: 0;
    }

    .auth-role {
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .auth-role-admin {
      background: var(--blue-soft);
      color: #1d4ed8;
    }

    .auth-role-staff {
      background: #f0eaff;
      color: #6d3fc4;
    }

    .auth-role-guest {
      background: #fff6db;
      color: #8a5c08;
    }

    .auth-name {
      overflow: hidden;
      color: #dbe4f3;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
    }

    .auth-logout {
      min-height: 30px;
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #dbe4f3;
      font-size: 12px;
      font-weight: 600;
    }

    .auth-logout:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .table-workspace {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      padding: 18px;
    }

    .table-workspace .topbar {
      flex: 0 0 auto;
      margin-bottom: 10px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .tables-panel {
      flex: 0 0 auto;
      display: grid;
      gap: 8px;
      max-height: 178px;
      min-height: 0;
      margin-bottom: 10px;
      padding: 10px;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .section {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .section-title {
      padding: 7px 0 0;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .table-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    button,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background-color var(--ease), border-color var(--ease), box-shadow var(--ease), transform var(--ease);
    }

    button:hover:not(:disabled) {
      border-color: #c1cce0;
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      box-shadow: none;
      transform: translateY(0);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .table-button {
      min-height: 30px;
      max-width: 220px;
      padding: 6px 10px;
      overflow: hidden;
      border-color: #dbe4f0;
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .table-button.active {
      border-color: #93c5fd;
      background: #eaf2ff;
      color: var(--blue);
      box-shadow: var(--shadow-sm);
    }

    .content {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      padding: 12px;
    }

    .result-header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 10px;
    }

    .table-title {
      font-size: 18px;
      font-weight: 600;
    }

    .showing {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .page-size {
      display: flex;
      gap: 7px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    select {
      min-width: 86px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 8px 9px;
      color: var(--text);
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .page-button {
      min-width: 34px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .page-button.active {
      border-color: var(--blue);
      background: var(--blue);
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(47, 95, 230, 0.28);
    }

    .ellipsis {
      color: var(--muted);
      padding: 0 2px;
    }

    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      background: var(--surface);
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--surface-soft);
      font-weight: 600;
    }

    tbody tr {
      transition: background-color var(--ease);
    }

    tbody tr:hover {
      background: #f8fbff;
    }

    .empty,
    .error,
    .loading {
      padding: 42px 16px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--red);
    }

    @media (max-width: 900px) {
      .table-page {
        grid-template-columns: 1fr;
      }

      .table-sidebar {
        min-height: auto;
      }

      .section {
        grid-template-columns: 1fr;
      }

      .result-header {
        flex-direction: column;
      }

      .controls,
      .pager {
        justify-content: flex-start;
      }
    }
  </style>

</head>

<body>
  <main class="table-page">
    <aside class="table-sidebar">
      <nav class="side-nav" aria-label="Main navigation">
        <a class="home-link active current-page" href="/">🗂️ Tables</a>
        <div class="nav-flyout">
          <button type="button" class="home-link nav-flyout-trigger">งานประจำ</button>
          <div class="nav-flyout-menu">
            <a class="home-link" href="/worksheet.html">📝 WS Input</a>
          </div>
        </div>
        <div class="nav-flyout">
          <button type="button" class="home-link nav-flyout-trigger">จัดการ</button>
          <div class="nav-flyout-menu">
            <a class="home-link" href="/student-manager.html">👤 Students</a>
            <a class="home-link" href="/payment.html">💰 Payment</a>
            <a class="home-link" href="/report.html">📊 Report</a>
            <a class="home-link" href="/progress-chart.html">📈 Progress Chart</a>
          </div>
        </div>
        <div class="nav-flyout">
          <button type="button" class="home-link nav-flyout-trigger">คลัง</button>
          <div class="nav-flyout-menu">
            <a class="home-link" href="/stock.html">📊 Stock</a>
            <a class="home-link" href="/stock-receive.html">📦 Stock Receive</a>
            <a class="home-link" href="/stock-cut.html">✂️ Stock Cut</a>
            <a class="home-link" href="/forecast.html">🔮 Forecast & Order</a>
          </div>
        </div>
        <div class="nav-flyout">

            <a class="home-link" href="/">🗂️ Tables</a>
            <a class="home-link" href="/opening-schedule.html" data-admin-only>🕒 Opening Schedule</a>

      </nav>

      <div class="auth-bar" id="authBar"></div>

    <section class="table-workspace">
      <header class="topbar">
        <div>
          <h1>KumonDB Table Explorer</h1>
          <div class="subtitle">Browse master and transaction data</div>
        </div>
      </header>
      <section class="tables-panel" id="tablesPanel">
        <div class="loading">กำลังโหลดตาราง...</div>
      </section>
      <section class="panel content" id="result">
        <div class="empty">เลือกตารางเพื่อดูข้อมูล</div>
      </section>
    </section>
  </main>

  <script>
    const DEFAULT_PAGE_SIZE = 100;
    const PAGE_SIZE_OPTIONS = [50, 100, 250, 500];

    const state = {
      categories: [],
      tableName: "",
      page: 1,
      pageSize: DEFAULT_PAGE_SIZE
    };

    async function loadTables() {
      const panel = document.getElementById("tablesPanel");

      try {
        const response = await fetch("/api/tables");
        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.error || "Cannot load tables");
        }

        state.categories = normalizeCategories(data);
        renderTableButtons();
      } catch (error) {
        panel.innerHTML = `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function normalizeCategories(data) {
      if (Array.isArray(data.categories)) {
        return data.categories;
      }

      if (Array.isArray(data)) {
        return [
          {
            id: "all",
            title: "Tables",
            tables: data
          }
        ];
      }

      return [];
    }

    function renderTableButtons() {
      const panel = document.getElementById("tablesPanel");

      if (state.categories.length === 0) {
        panel.innerHTML = `<div class="empty">ไม่พบตาราง</div>`;
        return;
      }

      panel.innerHTML = "";

      state.categories.forEach((category) => {
        const section = document.createElement("section");
        section.className = "section";

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = category.title;

        const buttons = document.createElement("div");
        buttons.className = "table-buttons";

        category.tables.forEach((table) => {
          const tableName = table.table_name;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "table-button";
          button.dataset.tableName = tableName;
          button.textContent = tableName;
          button.addEventListener("click", () => {
            loadTable(tableName, 1);
          });

          buttons.appendChild(button);
        });

        section.appendChild(title);
        section.appendChild(buttons);
        panel.appendChild(section);
      });

      updateActiveTableButton();
    }

    async function loadTable(tableName, page = 1) {
      state.tableName = tableName;
      state.page = page;
      updateActiveTableButton();
      renderLoading(tableName);

      try {
        const params = new URLSearchParams({
          page: String(page),
          pageSize: String(state.pageSize)
        });
        const response = await fetch(
          `/api/tables/${encodeURIComponent(tableName)}?${params.toString()}`
        );
        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.error || "Cannot load table");
        }

        state.page = data.page;
        state.pageSize = data.pageSize;
        renderTable(data);
      } catch (error) {
        renderError(tableName, error.message);
      }
    }

    function renderLoading(tableName) {
      const result = document.getElementById("result");

      result.innerHTML = `
        <div class="result-header">
          <div>
            <div class="table-title">${escapeHtml(tableName)}</div>
            <div class="showing">Loading...</div>
          </div>
        </div>
      `;
    }

    function renderError(tableName, message) {
      const result = document.getElementById("result");

      result.innerHTML = `
        <div class="result-header">
          <div>
            <div class="table-title">${escapeHtml(tableName)}</div>
          </div>
        </div>
        <div class="error">${escapeHtml(message)}</div>
      `;
    }

    function renderTable(data) {
      const result = document.getElementById("result");
      const columns = Array.isArray(data.columns) && data.columns.length > 0
        ? data.columns
        : Object.keys(data.rows[0] || {});

      result.innerHTML = `
        <div class="result-header">
          <div>
            <div class="table-title">${escapeHtml(data.table)}</div>
            <div class="showing">${renderShowingText(data)}</div>
          </div>
          <div class="controls">
            ${renderPageSizeControl(data)}
            ${renderPager(data)}
          </div>
        </div>
        ${renderRows(columns, data.rows)}
      `;

      bindControls(data);
    }

    function renderPageSizeControl(data) {
      const options = Array.isArray(data.pageSizeOptions) && data.pageSizeOptions.length > 0
        ? data.pageSizeOptions
        : PAGE_SIZE_OPTIONS;

      return `
        <label class="page-size">
          Rows
          <select id="pageSizeSelect">
            ${options.map((option) => `
              <option
                value="${option}"
                ${Number(option) === Number(data.pageSize) ? "selected" : ""}
              >
                ${option}
              </option>
            `).join("")}
          </select>
        </label>
      `;
    }

    function renderPager(data) {
      const totalPages = Number(data.totalPages || 0);
      const page = Number(data.page || 1);

      if (totalPages <= 1) {
        return `<div class="pager"></div>`;
      }

      return `
        <div class="pager">
          <button
            type="button"
            class="page-button"
            data-page="${page - 1}"
            ${page <= 1 ? "disabled" : ""}
          >
            Prev
          </button>
          ${paginationItems(page, totalPages).map((item) => {
            if (item === "...") {
              return `<span class="ellipsis">...</span>`;
            }

            return `
              <button
                type="button"
                class="page-button ${item === page ? "active" : ""}"
                data-page="${item}"
              >
                ${item}
              </button>
            `;
          }).join("")}
          <button
            type="button"
            class="page-button"
            data-page="${page + 1}"
            ${page >= totalPages ? "disabled" : ""}
          >
            Next
          </button>
        </div>
      `;
    }

    function renderShowingText(data) {
      const totalRows = Number(data.totalRows || 0);

      if (totalRows === 0) {
        return "Showing 0 rows";
      }

      return `Showing ${formatNumber(data.startRow)}-${formatNumber(data.endRow)} of ${formatNumber(totalRows)}`;
    }

    function renderRows(columns, rows) {
      if (!Array.isArray(rows) || rows.length === 0) {
        return `<div class="empty">ไม่มีข้อมูล</div>`;
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                ${columns.map((column) => `
                  <th>${escapeHtml(column)}</th>
                `).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>
                  ${columns.map((column) => `
                    <td>${formatValue(row[column])}</td>
                  `).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function bindControls(data) {
      const pageSizeSelect = document.getElementById("pageSizeSelect");

      if (pageSizeSelect) {
        pageSizeSelect.addEventListener("change", () => {
          state.pageSize = Number(pageSizeSelect.value);
          loadTable(data.table, 1);
        });
      }

      document
        .querySelectorAll(".page-button[data-page]")
        .forEach((button) => {
          button.addEventListener("click", () => {
            const page = Number(button.dataset.page);

            if (!Number.isFinite(page)) {
              return;
            }

            loadTable(data.table, page);
          });
        });
    }

    function updateActiveTableButton() {
      document
        .querySelectorAll(".table-button")
        .forEach((button) => {
          button.classList.toggle(
            "active",
            button.dataset.tableName === state.tableName
          );
        });
    }

    function paginationItems(page, totalPages) {
      if (totalPages <= 7) {
        return Array.from(
          { length: totalPages },
          (_, index) => index + 1
        );
      }

      const pages = new Set([
        1,
        totalPages,
        page - 1,
        page,
        page + 1
      ]);
      const sorted = [...pages]
        .filter((item) => item >= 1 && item <= totalPages)
        .sort((a, b) => a - b);
      const output = [];

      sorted.forEach((item, index) => {
        if (index > 0 && item - sorted[index - 1] > 1) {
          output.push("...");
        }

        output.push(item);
      });

      return output;
    }

    function formatValue(value) {
      if (value === null || value === undefined) {
        return "";
      }

      if (typeof value === "object") {
        return escapeHtml(JSON.stringify(value));
      }

      return escapeHtml(String(value));
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("en-US");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadTables();
  </script>
