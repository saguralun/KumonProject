<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KumonDB Table Explorer</title>

  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-soft: #f9fafb;
      --text: #111827;
      --muted: #667085;
      --line: #e5e7eb;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Segoe UI", sans-serif;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .sidebar {
      padding: 16px;
    }

    .section + .section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .table-buttons {
      display: grid;
      gap: 7px;
    }

    button,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .table-button {
      width: 100%;
      padding: 9px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
    }

    .table-button.active {
      border-color: #bfdbfe;
      background: var(--blue-soft);
      color: var(--blue);
    }

    .content {
      min-width: 0;
      padding: 16px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
    }

    .table-title {
      font-size: 20px;
      font-weight: 750;
    }

    .showing {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .page-size {
      display: flex;
      gap: 7px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    select {
      min-width: 86px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 8px 9px;
      color: var(--text);
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .page-button {
      min-width: 34px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .page-button.active {
      border-color: var(--blue);
      background: var(--blue);
      color: #ffffff;
    }

    .ellipsis {
      color: var(--muted);
      padding: 0 2px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      background: var(--surface);
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--surface-soft);
      font-weight: 750;
    }

    tbody tr:hover {
      background: #f8fbff;
    }

    .empty,
    .error,
    .loading {
      padding: 42px 16px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--red);
    }

    @media (max-width: 900px) {
      .page {
        padding: 16px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .result-header {
        flex-direction: column;
      }

      .controls,
      .pager {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>KumonDB Table Explorer</h1>
        <div class="subtitle">Browse master and transaction data</div>
      </div>
    </header>

    <div class="layout">
      <aside class="panel sidebar" id="tablesPanel">
        <div class="loading">กำลังโหลดตาราง...</div>
      </aside>

      <section class="panel content" id="result">
        <div class="empty">เลือกตารางเพื่อดูข้อมูล</div>
      </section>
    </div>
  </main>

  <script>
    const DEFAULT_PAGE_SIZE = 100;
    const PAGE_SIZE_OPTIONS = [50, 100, 250, 500];

    const state = {
      categories: [],
      tableName: "",
      page: 1,
      pageSize: DEFAULT_PAGE_SIZE
    };

    async function loadTables() {
      const panel = document.getElementById("tablesPanel");

      try {
        const response = await fetch("/api/tables");
        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.error || "Cannot load tables");
        }

        state.categories = normalizeCategories(data);
        renderTableButtons();
      } catch (error) {
        panel.innerHTML = `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function normalizeCategories(data) {
      if (Array.isArray(data.categories)) {
        return data.categories;
      }

      if (Array.isArray(data)) {
        return [
          {
            id: "all",
            title: "Tables",
            tables: data
          }
        ];
      }

      return [];
    }

    function renderTableButtons() {
      const panel = document.getElementById("tablesPanel");

      if (state.categories.length === 0) {
        panel.innerHTML = `<div class="empty">ไม่พบตาราง</div>`;
        return;
      }

      panel.innerHTML = "";

      state.categories.forEach((category) => {
        const section = document.createElement("section");
        section.className = "section";

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = category.title;

        const buttons = document.createElement("div");
        buttons.className = "table-buttons";

        category.tables.forEach((table) => {
          const tableName = table.table_name;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "table-button";
          button.dataset.tableName = tableName;
          button.textContent = tableName;
          button.addEventListener("click", () => {
            loadTable(tableName, 1);
          });

          buttons.appendChild(button);
        });

        section.appendChild(title);
        section.appendChild(buttons);
        panel.appendChild(section);
      });

      updateActiveTableButton();
    }

    async function loadTable(tableName, page = 1) {
      state.tableName = tableName;
      state.page = page;
      updateActiveTableButton();
      renderLoading(tableName);

      try {
        const params = new URLSearchParams({
          page: String(page),
          pageSize: String(state.pageSize)
        });
        const response = await fetch(
          `/api/tables/${encodeURIComponent(tableName)}?${params.toString()}`
        );
        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.error || "Cannot load table");
        }

        state.page = data.page;
        state.pageSize = data.pageSize;
        renderTable(data);
      } catch (error) {
        renderError(tableName, error.message);
      }
    }

    function renderLoading(tableName) {
      const result = document.getElementById("result");

      result.innerHTML = `
        <div class="result-header">
          <div>
            <div class="table-title">${escapeHtml(tableName)}</div>
            <div class="showing">Loading...</div>
          </div>
        </div>
      `;
    }

    function renderError(tableName, message) {
      const result = document.getElementById("result");

      result.innerHTML = `
        <div class="result-header">
          <div>
            <div class="table-title">${escapeHtml(tableName)}</div>
          </div>
        </div>
        <div class="error">${escapeHtml(message)}</div>
      `;
    }

    function renderTable(data) {
      const result = document.getElementById("result");
      const columns = Array.isArray(data.columns) && data.columns.length > 0
        ? data.columns
        : Object.keys(data.rows[0] || {});

      result.innerHTML = `
        <div class="result-header">
          <div>
            <div class="table-title">${escapeHtml(data.table)}</div>
            <div class="showing">${renderShowingText(data)}</div>
          </div>
          <div class="controls">
            ${renderPageSizeControl(data)}
            ${renderPager(data)}
          </div>
        </div>
        ${renderRows(columns, data.rows)}
      `;

      bindControls(data);
    }

    function renderPageSizeControl(data) {
      const options = Array.isArray(data.pageSizeOptions) && data.pageSizeOptions.length > 0
        ? data.pageSizeOptions
        : PAGE_SIZE_OPTIONS;

      return `
        <label class="page-size">
          Rows
          <select id="pageSizeSelect">
            ${options.map((option) => `
              <option
                value="${option}"
                ${Number(option) === Number(data.pageSize) ? "selected" : ""}
              >
                ${option}
              </option>
            `).join("")}
          </select>
        </label>
      `;
    }

    function renderPager(data) {
      const totalPages = Number(data.totalPages || 0);
      const page = Number(data.page || 1);

      if (totalPages <= 1) {
        return `<div class="pager"></div>`;
      }

      return `
        <div class="pager">
          <button
            type="button"
            class="page-button"
            data-page="${page - 1}"
            ${page <= 1 ? "disabled" : ""}
          >
            Prev
          </button>
          ${paginationItems(page, totalPages).map((item) => {
            if (item === "...") {
              return `<span class="ellipsis">...</span>`;
            }

            return `
              <button
                type="button"
                class="page-button ${item === page ? "active" : ""}"
                data-page="${item}"
              >
                ${item}
              </button>
            `;
          }).join("")}
          <button
            type="button"
            class="page-button"
            data-page="${page + 1}"
            ${page >= totalPages ? "disabled" : ""}
          >
            Next
          </button>
        </div>
      `;
    }

    function renderShowingText(data) {
      const totalRows = Number(data.totalRows || 0);

      if (totalRows === 0) {
        return "Showing 0 rows";
      }

      return `Showing ${formatNumber(data.startRow)}-${formatNumber(data.endRow)} of ${formatNumber(totalRows)}`;
    }

    function renderRows(columns, rows) {
      if (!Array.isArray(rows) || rows.length === 0) {
        return `<div class="empty">ไม่มีข้อมูล</div>`;
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                ${columns.map((column) => `
                  <th>${escapeHtml(column)}</th>
                `).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>
                  ${columns.map((column) => `
                    <td>${formatValue(row[column])}</td>
                  `).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function bindControls(data) {
      const pageSizeSelect = document.getElementById("pageSizeSelect");

      if (pageSizeSelect) {
        pageSizeSelect.addEventListener("change", () => {
          state.pageSize = Number(pageSizeSelect.value);
          loadTable(data.table, 1);
        });
      }

      document
        .querySelectorAll(".page-button[data-page]")
        .forEach((button) => {
          button.addEventListener("click", () => {
            const page = Number(button.dataset.page);

            if (!Number.isFinite(page)) {
              return;
            }

            loadTable(data.table, page);
          });
        });
    }

    function updateActiveTableButton() {
      document
        .querySelectorAll(".table-button")
        .forEach((button) => {
          button.classList.toggle(
            "active",
            button.dataset.tableName === state.tableName
          );
        });
    }

    function paginationItems(page, totalPages) {
      if (totalPages <= 7) {
        return Array.from(
          { length: totalPages },
          (_, index) => index + 1
        );
      }

      const pages = new Set([
        1,
        totalPages,
        page - 1,
        page,
        page + 1
      ]);
      const sorted = [...pages]
        .filter((item) => item >= 1 && item <= totalPages)
        .sort((a, b) => a - b);
      const output = [];

      sorted.forEach((item, index) => {
        if (index > 0 && item - sorted[index - 1] > 1) {
          output.push("...");
        }

        output.push(item);
      });

      return output;
    }

    function formatValue(value) {
      if (value === null || value === undefined) {
        return "";
      }

      if (typeof value === "object") {
        return escapeHtml(JSON.stringify(value));
      }

      return escapeHtml(String(value));
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("en-US");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadTables();
  </script>
</body>
</html>
