<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังเปิด KumonDB…</title>
  <style>
    :root {
      --rail: #0e1e33;
      --blue: #2f5fe6;
      --font-sans: "Sarabun", "Inter", "Segoe UI", Tahoma, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #16283f, var(--rail) 60%);
      color: #fff;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .splash {
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
    }

    .brand {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .bar {
      width: 260px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .bar::before {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: var(--blue);
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }

    .status {
      min-height: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.78);
    }

    .hint {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
    }

    @media (prefers-reduced-motion: reduce) {
      .bar::before { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="brand">KumonDB</div>
    <div class="bar" role="progressbar" aria-label="กำลังโหลด"></div>
    <div class="status" id="status">กำลังเปิดโปรแกรม…</div>
    <div class="hint" id="hint"></div>
  </div>

  <script>
    // Opened from file:// by launcher/start.ps1 the instant the shortcut is
    // clicked — before the Node server has finished booting. We poll the
    // login page and replace ourselves with it as soon as it answers, so
    // the Chrome app window flows straight into the real app.
    var TARGET = "http://localhost:3000/login.html";
    var startedAt = Date.now();
    var statusEl = document.getElementById("status");
    var hintEl = document.getElementById("hint");

    function tick() {
      var secs = (Date.now() - startedAt) / 1000;

      if (secs > 60) {
        statusEl.textContent = "ยังเชื่อมต่อเซิร์ฟเวอร์ไม่ได้";
        hintEl.textContent = "ลองปิดหน้าต่างนี้แล้วเปิดโปรแกรมใหม่อีกครั้ง";
      } else if (secs > 20) {
        statusEl.textContent = "เซิร์ฟเวอร์กำลังเริ่มทำงาน ใช้เวลานานกว่าปกติเล็กน้อย…";
        hintEl.textContent = "ไม่ต้องกดเปิดซ้ำ ระบบกำลังทำงานอยู่";
      } else {
        statusEl.textContent = "เซิร์ฟเวอร์กำลังเริ่มทำงาน รอสักครู่…";
        hintEl.textContent = "ไม่ต้องกดเปิดซ้ำ ระบบกำลังทำงานอยู่";
      }
    }

    function probe() {
      // no-cors: we only care whether the server answers at all, not the
      // response body. Resolves once it's up, rejects while the port is
      // still refusing connections.
      fetch(TARGET, { mode: "no-cors", cache: "no-store" })
        .then(function () {
          statusEl.textContent = "พร้อมแล้ว กำลังเข้าสู่ระบบ…";
          window.location.replace(TARGET);
        })
        .catch(function () {
          tick();
          setTimeout(probe, 400);
        });
    }

    tick();
    probe();
  </script>
</body>
</html>
